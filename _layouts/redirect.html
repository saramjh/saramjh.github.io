<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="{{ page.redirect_to }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">
  <title>{{ page.title | escape }}</title>
  <script>window.location.replace({{ page.redirect_to | jsonify }});</script>
</head>
<body>
  <p>{% if page.lang == 'en' %}This page has moved.{% else %}이 페이지는 이동했습니다.{% endif %} <a href="{{ page.redirect_to | escape }}">{% if page.lang == 'en' %}Open the current page{% else %}현재 페이지 열기{% endif %}</a></p>
</body>
</html>
