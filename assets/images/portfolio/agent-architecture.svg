  </g>
  <rect x="365" y="581" width="470" height="100" rx="14" fill="#171e2e" stroke="#7187b8" stroke-width="2"/>
  <g fill="#e7eaf5" text-anchor="middle" font-family="Arial,sans-serif">
    <text x="600" y="622" font-size="22" fill="#b2c6f8">Persistent execution ledger</text>
    <text x="600" y="655" font-size="18">state · evidence · continuity</text>
