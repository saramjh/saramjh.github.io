<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Five specialist worker lanes under a Session Supervisor</title>
  <desc id="d">A conceptual diagram of a local supervisor coordinating five separate project workers: Ave for KoreAves, Orion for Space Atlas, Soy for Spoonie, Riff for Social Relations Lab, and Dev for Maker Log. A persistent execution ledger is shown below. This is not a live runtime status display.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#303e64"/><stop offset="1" stop-color="#151c2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#141927"/>
  <path d="M600 284V352 M136 352H1064 M136 352V401 M368 352V401 M600 352V401 M832 352V401 M1064 352V401 M600 544V581" stroke="#a8baed" stroke-opacity=".78" stroke-width="3" fill="none"/>
  <rect x="377" y="102" width="446" height="182" rx="16" fill="url(#g)" stroke="#a6b9ed" stroke-width="2"/>
  <g fill="#f1f4fb" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="600" y="169" font-size="24" fill="#b8c8f9">LOCAL OPERATIONS</text>
    <text x="600" y="215" font-size="39" font-weight="bold">Session Supervisor</text>
    <text x="600" y="254" font-size="17" fill="#c1cff2">Separate accounts · original receipts</text>
  </g>
  <g fill="#f0f2fb" text-anchor="middle" font-family="Arial,sans-serif">
  <g data-worker="ave">
    <rect x="26" y="401" width="220" height="143" rx="12" fill="#252f47" stroke="#8295c4" stroke-width="2"/>
    <text x="136" y="442" font-size="30" font-weight="bold">Ave</text>
    <text x="136" y="477" font-size="21">KoreAves</text>
    <text x="136" y="511" font-size="16" fill="#c1cff2">Bird evidence</text>
  </g>
  <g data-worker="orion">
    <rect x="258" y="401" width="220" height="143" rx="12" fill="#252f47" stroke="#8295c4" stroke-width="2"/>
    <text x="368" y="442" font-size="30" font-weight="bold">Orion</text>
    <text x="368" y="477" font-size="21">Space Atlas</text>
    <text x="368" y="511" font-size="16" fill="#c1cff2">Science education</text>
  </g>
  <g data-worker="soy">
    <rect x="490" y="401" width="220" height="143" rx="12" fill="#252f47" stroke="#8295c4" stroke-width="2"/>
    <text x="600" y="442" font-size="30" font-weight="bold">Soy</text>
    <text x="600" y="477" font-size="21">Spoonie</text>
    <text x="600" y="511" font-size="16" fill="#c1cff2">Recipe community</text>
  </g>
  <g data-worker="riff">
    <rect x="722" y="401" width="220" height="143" rx="12" fill="#252f47" stroke="#8295c4" stroke-width="2"/>
    <text x="832" y="442" font-size="30" font-weight="bold">Riff</text>
    <text x="832" y="477" font-size="18">Social Relations Lab</text>
    <text x="832" y="511" font-size="16" fill="#c1cff2">Audience relations</text>
  </g>
  <g data-worker="dev">
    <rect x="954" y="401" width="220" height="143" rx="12" fill="#252f47" stroke="#8295c4" stroke-width="2"/>
