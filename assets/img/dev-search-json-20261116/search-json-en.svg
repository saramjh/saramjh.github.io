<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">JSON is not HTML</title>
<desc id="desc">Old public JSON had Spoonie&#39;s and GREENUS Resources &amp; Tools as entity strings. The shipped Jekyll fix produces normal JSON text. Values are from original PR #175 and its deployed search index.</desc>
<rect width="1200" height="630" fill="#f5f7f9"/>
<rect x="48" y="42" width="6" height="70" rx="3" fill="#197d77"/>
<text x="72" y="78" font-family="sans-serif" font-size="40" font-weight="720" fill="#142838">JSON is not HTML</text>
<text x="73" y="112" font-family="sans-serif" font-size="20" font-weight="470" fill="#526675">Public search index · PR #175</text>
<rect x="48" y="146" width="528" height="350" rx="12" fill="#ffffff" stroke="#d7dee4"/>
<rect x="624" y="146" width="528" height="350" rx="12" fill="#ffffff" stroke="#d7dee4"/>
<rect x="48" y="146" width="528" height="9" rx="4" fill="#bc6d59"/>
<rect x="624" y="146" width="528" height="9" rx="4" fill="#197d77"/>
<text x="74" y="201" font-family="sans-serif" font-size="25" font-weight="720" fill="#8d4737">Before / HTML escaping</text>
<text x="650" y="201" font-family="sans-serif" font-size="25" font-weight="720" fill="#146962">After / JSON serialization</text>
<text x="74" y="241" font-family="sans-serif" font-size="18" font-weight="520" fill="#526675">escape → quoted field</text>
<text x="650" y="241" font-family="sans-serif" font-size="18" font-weight="520" fill="#526675">jsonify → textContent</text>
<rect x="73" y="264" width="478" height="112" rx="7" fill="#faf3f1"/>
<rect x="649" y="264" width="478" height="112" rx="7" fill="#ecf7f5"/>
<text x="92" y="309" font-family="monospace" font-size="26" font-weight="600" fill="#8d4737">Spoonie&amp;#39;s</text>
<text x="668" y="309" font-family="monospace" font-size="26" font-weight="600" fill="#146962">Spoonie's</text>
<text x="92" y="353" font-family="monospace" font-size="20" font-weight="520" fill="#8d4737">GREENUS Resources &amp;amp; Tools</text>
<text x="668" y="353" font-family="monospace" font-size="20" font-weight="520" fill="#146962">GREENUS Resources &amp; Tools</text>
<text x="74" y="414" font-family="sans-serif" font-size="18" font-weight="480" fill="#526675">Entity strings inside title and source</text>
<text x="650" y="414" font-family="sans-serif" font-size="18" font-weight="480" fill="#526675">Original text preserved in JSON</text>
<text x="74" y="458" font-family="sans-serif" font-size="23" font-weight="680" fill="#8d4737">Before: 36 affected fields</text>
<text x="650" y="458" font-family="sans-serif" font-size="23" font-weight="680" fill="#146962">After: 0 matching fields</text>
<rect x="48" y="529" width="1104" height="62" rx="8" fill="#e8eef2"/>
<text x="76" y="568" font-family="sans-serif" font-size="21" font-weight="540" fill="#2b4555">176 articles + 28 external records = 204 indexed entries retained</text>
</svg>
