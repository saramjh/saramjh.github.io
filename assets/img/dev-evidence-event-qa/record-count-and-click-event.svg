<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Portfolio evidence regression and event scope</title>
<desc id="desc">Two panels explain how confirmed evidence records grew from six to eight and a fixed browser assertion failed, and how GA4 link-selection events cannot prove destination usage or adoption.</desc>
<rect width="1200" height="700" fill="#10151c"/>
<text x="64" y="78" fill="#eef2f6" font-family="Arial,sans-serif" font-size="35" font-weight="700">What the evidence tests actually proved</text>
<text x="64" y="113" fill="#a7bacb" font-family="Arial,sans-serif" font-size="19">Original diagram · 9 Nov 2026 · DevTestudinidae</text>
<rect x="64" y="146" width="1072" height="214" rx="17" fill="#1a2734" stroke="#3c5366" stroke-width="2"/>
<text x="94" y="187" fill="#d8e7f2" font-family="Arial,sans-serif" font-size="21" font-weight="700">1. Source records and browser regression</text>
<rect x="93" y="212" width="279" height="108" rx="12" fill="#293e53"/>
<text x="117" y="245" fill="#e6eef5" font-family="Arial,sans-serif" font-size="21">Confirmed records</text>
<text x="117" y="291" fill="#77d1e8" font-family="Arial,sans-serif" font-size="36" font-weight="700">6  →  8</text>
<path d="M375 264 H422" stroke="#a7bacb" stroke-width="3"/><path d="M422 264 l-13 -9 v18 z" fill="#a7bacb"/>
<rect x="426" y="212" width="288" height="108" rx="12" fill="#473039"/>
<text x="450" y="244" fill="#ffdfda" font-family="Arial,sans-serif" font-size="20">Fixed expectation: 6</text>
<text x="450" y="282" fill="#ffa89c" font-family="Arial,sans-serif" font-size="25" font-weight="700">Browser test failed</text>
<path d="M717 264 H764" stroke="#a7bacb" stroke-width="3"/><path d="M764 264 l-13 -9 v18 z" fill="#a7bacb"/>
<rect x="768" y="212" width="337" height="108" rx="12" fill="#254337"/>
<text x="790" y="244" fill="#d5efe4" font-family="Arial,sans-serif" font-size="19">Count from source ledger</text>
<text x="790" y="282" fill="#8ee9bb" font-family="Arial,sans-serif" font-size="24" font-weight="700">CI passed</text>
<text x="94" y="344" fill="#b6c6d5" font-family="Arial,sans-serif" font-size="16">Counts describe source records, not traffic, conversions or adoption.</text>
<rect x="64" y="391" width="1072" height="241" rx="17" fill="#1a2734" stroke="#3c5366" stroke-width="2"/>
<text x="94" y="434" fill="#d8e7f2" font-family="Arial,sans-serif" font-size="21" font-weight="700">2. What the GA4 event can observe</text>
<rect x="93" y="460" width="279" height="119" rx="12" fill="#293e53"/>
<text x="113" y="493" fill="#e6eef5" font-family="Arial,sans-serif" font-size="20">Reader selects link</text>
<text x="113" y="535" fill="#a7bacb" font-family="Arial,sans-serif" font-size="17">From a portfolio row</text>
<path d="M375 515 H422" stroke="#a7bacb" stroke-width="3"/><path d="M422 515 l-13 -9 v18 z" fill="#a7bacb"/>
<rect x="426" y="460" width="332" height="119" rx="12" fill="#254337"/>
<text x="447" y="491" fill="#d5efe4" font-family="Arial,sans-serif" font-size="20">GA4 select_content</text>
<text x="447" y="524" fill="#8ee9bb" font-family="Arial,sans-serif" font-size="17">item_id = public record ID</text>
<text x="447" y="550" fill="#b6c6d5" font-family="Arial,sans-serif" font-size="15">Only when GA4 is available</text>
<path d="M761 515 H807" stroke="#a7bacb" stroke-width="3"/><path d="M807 515 l-13 -9 v18 z" fill="#a7bacb"/>
<rect x="811" y="460" width="294" height="119" rx="12" fill="#473039"/>
<text x="831" y="491" fill="#ffdfda" font-family="Arial,sans-serif" font-size="20">Beyond this link</text>
<text x="831" y="527" fill="#ffa89c" font-family="Arial,sans-serif" font-size="26" font-weight="700">Unknown</text>
<text x="831" y="550" fill="#ddbcc0" font-family="Arial,sans-serif" font-size="15">Destination use, adoption</text>
<text x="94" y="612" fill="#b6c6d5" font-family="Arial,sans-serif" font-size="16">New event code was deployed. No actual GA4 event totals were retrieved.</text>
<text x="64" y="672" fill="#8b9aa9" font-family="Arial,sans-serif" font-size="16">Sources: first-party GitHub PR #12 and PR #13, with native CI receipts</text>
</svg>
