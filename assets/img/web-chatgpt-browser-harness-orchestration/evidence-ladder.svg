<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-label="What counts as a result?"><rect width="1100" height="680" fill="#f7f9fc"/><text x="55" y="66" font-size="30" font-weight="700" fill="#132a48">What counts as a result?</text><rect x="80" y="135" width="940" height="95" rx="14" fill="#e9f2ff" stroke="#c9d5e7"/><text x="100" y="167" font-size="21" font-weight="700" fill="#142d4e">Level 1: Local activity</text><text x="100" y="194" font-size="15" fill="#3b526b">Prompt, draft, test, and session continuation</text><rect x="80" y="270" width="940" height="95" rx="14" fill="#e7f5ee" stroke="#c9d5e7"/><text x="100" y="302" font-size="21" font-weight="700" fill="#142d4e">Level 2: Verified external action</text><text x="100" y="329" font-size="15" fill="#3b526b">Provider receipt, published URL, or delivered message</text><rect x="80" y="405" width="940" height="95" rx="14" fill="#fff0d8" stroke="#c9d5e7"/><text x="100" y="437" font-size="21" font-weight="700" fill="#142d4e">Level 3: Real-world outcome</text><text x="100" y="464" font-size="15" fill="#3b526b">Human reply, adoption, signup, or confirmed use</text><path d="M550 230 V270 M550 365 V405" stroke="#58749b" stroke-width="3"/><text x="55" y="650" font-size="14" fill="#64748b">Conceptual diagram. Not a screenshot or performance measurement.</text></svg>