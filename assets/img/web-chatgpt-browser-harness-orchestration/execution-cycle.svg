<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-label="Evidence-driven execution cycle"><rect width="1100" height="680" fill="#f7f9fc"/><text x="55" y="66" font-size="30" font-weight="700" fill="#132a48">Evidence-driven execution cycle</text><rect x="65" y="120" width="440" height="88" rx="14" fill="#e9f2ff" stroke="#c9d5e7"/><text x="85" y="152" font-size="21" font-weight="700" fill="#142d4e">1. Observe</text><text x="85" y="179" font-size="15" fill="#3b526b">Check session and task state</text><rect x="595" y="120" width="440" height="88" rx="14" fill="#e9f2ff" stroke="#c9d5e7"/><text x="615" y="152" font-size="21" font-weight="700" fill="#142d4e">2. Decide</text><text x="615" y="179" font-size="15" fill="#3b526b">Choose a permitted next action</text><rect x="595" y="285" width="440" height="88" rx="14" fill="#e7f5ee" stroke="#c9d5e7"/><text x="615" y="317" font-size="21" font-weight="700" fill="#142d4e">3. Execute</text><text x="615" y="344" font-size="15" fill="#3b526b">Use verified browser or provider route</text><rect x="65" y="285" width="440" height="88" rx="14" fill="#e7f5ee" stroke="#c9d5e7"/><text x="85" y="317" font-size="21" font-weight="700" fill="#142d4e">4. Verify</text><text x="85" y="344" font-size="15" fill="#3b526b">Collect provider-native evidence</text><rect x="65" y="450" width="440" height="88" rx="14" fill="#fff0d8" stroke="#c9d5e7"/><text x="85" y="482" font-size="21" font-weight="700" fill="#142d4e">5. Evaluate</text><text x="85" y="509" font-size="15" fill="#3b526b">Separate attempts from outcomes</text><rect x="595" y="450" width="440" height="88" rx="14" fill="#fff0d8" stroke="#c9d5e7"/><text x="615" y="482" font-size="21" font-weight="700" fill="#142d4e">6. Improve</text><text x="615" y="509" font-size="15" fill="#3b526b">Update strategy for the next cycle</text><path d="M505 164 H595 M815 208 V285 M595 329 H505 M285 373 V450 M505 494 H595 M815 538 V575 H50 V164 H65" fill="none" stroke="#58749b" stroke-width="3" stroke-linecap="round"/><text x="55" y="650" font-size="14" fill="#64748b">Conceptual diagram. Not a screenshot or performance measurement.</text></svg>