name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      enable_search_engine_notifications:
        description: "Submit changed URLs to Bing and IndexNow for this run."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Playwright 1.56.x supports Ubuntu 24.04 Chromium dependencies; do not float to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Validate growth ownership
        run: python3 scripts/check_growth_ownership.py
      - name: Test homepage project directory
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test case-study outbound click privacy
        run: node --test tests/article_product_outbound_runtime.cjs
      - name: Test Epson documentation selection privacy and scope
        run: node --test tests/epson_official_support_click_runtime.cjs
      - name: Test developer contact-link selection without sending mail
        run: node --test tests/portfolio_contact_selection_runtime.cjs
      - name: Test first-party Space Atlas outbound selection
        run: node --test tests/portfolio_space_atlas_outbound_runtime.cjs
      - name: Test mobile navigation keyboard and background focus
        run: node tests/mobile_navigation_focus_runtime.cjs
      - name: Test theme toggle on first visit and restricted storage
        run: node tests/theme-toggle-runtime.cjs
      - name: Test topic search and article-group fallback
        run: node tests/tags_topic_filter_runtime.cjs
      - name: Test archive search progressive results
        run: node tests/archive_search_progressive_results_runtime.cjs
      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Check images and sitemap
        run: bundle exec ruby scripts/check_site.rb
      - name: Check rendered article product-link measurement coverage
        run: python3 tests/article_product_outbound_rendered.py
      - name: Check local navigation links and fragments
        run: python3 scripts/check_internal_links.py
      - name: Check SEO contracts
        run: bundle exec ruby scripts/check_seo.rb
      - name: Check ad-free portfolio contract
        run: bundle exec ruby scripts/check_portfolio.rb
      - name: Install portfolio browser-test dependencies
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Playwright for preinstalled Chrome checks
        run: |
          python -m pip install playwright==1.56.0
          command -v google-chrome
          google-chrome --version
      - name: Verify portfolio layout in real browser
        env:
          BLOG_TEST_BROWSER_CHANNEL: chrome
        run: |
          python -m http.server 4317 --directory _site > /tmp/portfolio-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/portfolio_layout_smoke.py
          python tests/archive_search_browser.py
          python tests/tags_topic_filter_browser.py
          python tests/epson_official_support_browser.py
          python tests/logitech_patch_browser.py
          python tests/indexnow_mobile_tables_browser.py
          python tests/inline_code_mobile_browser.py
          python tests/gsc_property_truth_browser.py
          python tests/analytics_tool_boundaries_browser.py
          python tests/portfolio_contact_selection_browser.py
          python tests/article_product_outbound_browser.py
      - name: Test post assets
        run: bundle exec ruby tests/post_assets_test.rb
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Verify last successful Pages revision
        id: predecessor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_pages_predecessor.py
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Search Engines (Bing API & IndexNow)
        if: github.event_name == 'workflow_dispatch' && inputs.enable_search_engine_notifications == true
        run: python3 scripts/submit_search_engines.py
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          INDEXNOW_BEFORE_SHA: ${{ steps.predecessor.outputs.before_sha }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}


