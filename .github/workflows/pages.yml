name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Playwright 1.56.x supports Ubuntu 24.04 Chromium dependencies; do not float to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Validate growth ownership
        run: python3 scripts/check_growth_ownership.py
      - name: Test homepage project directory
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Check images and sitemap
        run: bundle exec ruby scripts/check_site.rb
      - name: Check SEO contracts
        run: bundle exec ruby scripts/check_seo.rb
      - name: Check ad-free portfolio contract
        run: bundle exec ruby scripts/check_portfolio.rb
      - name: Install portfolio browser-test dependencies
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Chromium for responsive visual geometry checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify portfolio layout in real browser
        run: |
          python -m http.server 4317 --directory _site > /tmp/portfolio-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/portfolio_layout_smoke.py
      - name: Test post assets
        run: bundle exec ruby tests/post_assets_test.rb
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Search Engines (Bing API & IndexNow)
        run: python3 scripts/submit_search_engines.py
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}


