<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One homepage, seven destinations</title>
  <desc id="desc">The root Jekyll homepage Projects and Services directory links to four separate domains and three paths under the shared hostname.</desc>
  <rect width="1200" height="720" fill="#f4f2ec"/>
  <text x="72" y="78" fill="#172b3a" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">One homepage, seven destinations</text>
  <text x="72" y="116" fill="#52616b" font-family="Inter, Arial, sans-serif" font-size="18">One place to discover projects, with each destination URL left intact.</text>
  <rect x="72" y="148" width="1056" height="76" rx="12" fill="#203746"/>
  <text x="104" y="181" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">saramjh.github.io · Projects &amp; Services</text>
  <text x="104" y="205" fill="#d8e1e5" font-family="Inter, Arial, sans-serif" font-size="14">Root Jekyll homepage directory</text>
  <path d="M600 224 V246 H326 V266 M600 246 H874 V266" fill="none" stroke="#84939b" stroke-width="2"/>
  <rect x="72" y="266" width="510" height="350" rx="14" fill="#ebe9e1" stroke="#d2d0c8"/>
  <rect x="620" y="266" width="508" height="350" rx="14" fill="#ebe9e1" stroke="#d2d0c8"/>
  <text x="100" y="308" fill="#263d4a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Separate domains · 4</text>
  <text x="648" y="308" fill="#263d4a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Paths on shared host · 3</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="96" y="332" width="220" height="104" rx="9" fill="#ffffff" stroke="#cbd2d2"/>
    <text x="116" y="372" fill="#172b3a" font-size="18" font-weight="700">KoreAves</text>
    <text x="116" y="402" fill="#596a73" font-size="14">koreaves.com</text>
    <rect x="338" y="332" width="220" height="104" rx="9" fill="#ffffff" stroke="#cbd2d2"/>
    <text x="358" y="372" fill="#172b3a" font-size="18" font-weight="700">Spoonie</text>
    <text x="358" y="402" fill="#596a73" font-size="14">spoonie.kr</text>
    <rect x="96" y="452" width="220" height="104" rx="9" fill="#ffffff" stroke="#cbd2d2"/>
    <text x="116" y="492" fill="#172b3a" font-size="18" font-weight="700">Sigub</text>
    <text x="116" y="522" fill="#596a73" font-size="14">sigub.kr</text>
    <rect x="338" y="452" width="220" height="104" rx="9" fill="#ffffff" stroke="#cbd2d2"/>
    <text x="358" y="492" fill="#172b3a" font-size="18" font-weight="700">Space Atlas</text>
    <text x="358" y="522" fill="#596a73" font-size="14">spaceatlasedu.org</text>
    <rect x="646" y="332" width="456" height="80" rx="9" fill="#ffffff" stroke="#cbd2d2"/>
    <text x="670" y="366" fill="#172b3a" font-size="17" font-weight="700">Scratch Lottery</text>
    <text x="670" y="391" fill="#596a73" font-size="14">/scratchLottery/</text>
    <rect x="646" y="432" width="456" height="80" rx="9" fill="#ffffff" stroke="#cbd2d2"/>
    <text x="670" y="466" fill="#172b3a" font-size="17" font-weight="700">Billionaire Lookalike · KR</text>
    <text x="670" y="491" fill="#596a73" font-size="14">/richChecker/</text>
