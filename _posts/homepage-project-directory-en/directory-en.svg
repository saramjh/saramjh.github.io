  <path d="M72 646 H1128" stroke="#c8c7bf" stroke-width="1"/>
  <text x="72" y="680" fill="#52616b" font-family="Inter, Arial, sans-serif" font-size="16">This release changed the root directory only. It did not modify destination application code.</text>
