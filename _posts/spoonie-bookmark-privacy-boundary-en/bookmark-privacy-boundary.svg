<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Spoonie | Bookmark access boundary</title>
<desc id="desc">Raw bookmark relationships stay owner-scoped; discovery uses aggregate counts.</desc>
<rect width="1200" height="630" fill="#F9FAF6"/>
<rect width="1200" height="116" fill="#123A31"/>
<g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="52" y="54" font-size="31" font-weight="700" fill="#F7FCF8">Spoonie | Bookmark access boundary</text>
<text x="54" y="88" font-size="17" fill="#CDE8D7">PR #39 · merged 2026-11-13 · production privileges and anonymous API check</text>
<rect x="52" y="138" width="1096" height="78" rx="12" fill="#FFFFFF" stroke="#D8E3DA" stroke-width="2"/>
<text x="78" y="171" font-size="20" font-weight="700" fill="#244939">Raw relationship data</text>
<text x="78" y="198" font-size="16" fill="#63796D">public.bookmarks · user_id · item_id · created_at</text>
<path d="M600 216v15M330 231h540M330 231v13M870 231v13" stroke="#6A927D" stroke-width="3" fill="none" stroke-linecap="round"/>
<rect x="52" y="244" width="530" height="154" rx="14" fill="#F9F1ED" stroke="#E6D5CC" stroke-width="2"/>
<rect x="618" y="244" width="530" height="154" rx="14" fill="#EEF5EF" stroke="#D1E1D4" stroke-width="2"/>
<text x="80" y="280" font-size="21" font-weight="700" fill="#814C3B">Anonymous request · anon</text>
<text x="80" y="316" font-size="17" fill="#5C4C43">Public SELECT policy removed</text>
<text x="80" y="345" font-size="17" fill="#5C4C43">Table SELECT privilege revoked</text>
<rect x="80" y="359" width="190" height="26" rx="7" fill="#EBD7CD"/>
<text x="92" y="378" font-size="14" font-weight="700" fill="#814C3B">Production REST HEAD · HTTP 401</text>
<text x="646" y="280" font-size="21" font-weight="700" fill="#1C6651">Signed-in user · authenticated</text>
<text x="646" y="316" font-size="17" fill="#3F5F52">USING + WITH CHECK</text>
<text x="646" y="345" font-size="17" fill="#3F5F52">user_id = auth.uid()</text>
<rect x="646" y="359" width="250" height="26" rx="7" fill="#D8E8DA"/>
<text x="658" y="378" font-size="14" font-weight="700" fill="#1C6651">Manage own bookmark rows only</text>
<text x="52" y="441" font-size="20" font-weight="700" fill="#244939">Aggregate paths remain available</text>
<rect x="52" y="460" width="530" height="106" rx="12" fill="#FFFFFF" stroke="#D8E3DA" stroke-width="2"/>
<rect x="618" y="460" width="530" height="106" rx="12" fill="#FFFFFF" stroke="#D8E3DA" stroke-width="2"/>
<text x="78" y="493" font-size="19" font-weight="700" fill="#1C6651">get_explore</text>
<text x="78" y="521" font-size="16" fill="#3F5F52">Distinct savers over the last 30 days</text>
<text x="78" y="546" font-size="15" fill="#63796D">Public recipe ranking signal</text>
<text x="644" y="493" font-size="19" font-weight="700" fill="#1C6651">get_recipe_activity</text>
<text x="644" y="521" font-size="16" fill="#3F5F52">Returns save count to recipe owner</text>
<text x="644" y="546" font-size="15" fill="#63796D">Does not return saver identities</text>
<text x="52" y="604" font-size="16" fill="#385B4A">Raw bookmark relationships stay owner-scoped; discovery uses aggregate counts.</text>
</g></svg>