<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Context tools installed without a continuity lifecycle</title>
<desc id="d">Serena, claude-mem and Ponytail exist, but no lifecycle automatically restores current project context into a fresh ChatGPT web session.</desc>
<defs><style>
.bg{fill:#111418}.box{fill:#181d23;stroke:#303842;stroke-width:2}.text{fill:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.muted{fill:#a7b0ba;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.bad{fill:#b95858}.warn{fill:#c28a34}.line{stroke:#56616d;stroke-width:3;fill:none;stroke-dasharray:8 8}.h{font-size:28px;font-weight:760}.b{font-size:20px;font-weight:700}.s{font-size:16px}
</style></defs>
<rect class="bg" width="1200" height="700" rx="24"/>
<text x="70" y="74" class="text h">The tools were installed. The lifecycle was missing.</text>
<text x="70" y="108" class="muted s">Installed tools did not automatically make a fresh session resume the project.</text>
<rect x="70" y="165" width="300" height="150" rx="18" class="box"/>
<text x="220" y="215" text-anchor="middle" class="text b">Serena</text>
<text x="220" y="250" text-anchor="middle" class="muted s">Project / memory retrieval</text>
<text x="220" y="278" text-anchor="middle" class="muted s">Automatic session bootstrap is separate</text>
<rect x="450" y="165" width="300" height="150" rx="18" class="box"/>
<text x="600" y="215" text-anchor="middle" class="text b">claude-mem</text>
<text x="600" y="250" text-anchor="middle" class="muted s">Installed</text>
<text x="600" y="278" text-anchor="middle" class="text" style="font-size:17px;font-weight:700">Current corpus: 0 records</text>
<rect x="830" y="165" width="300" height="150" rx="18" class="box"/>
<text x="980" y="215" text-anchor="middle" class="text b">Ponytail</text>
<text x="980" y="250" text-anchor="middle" class="muted s">YAGNI · reuse · minimum diff</text>
<text x="980" y="278" text-anchor="middle" class="muted s">Policy, not project memory</text>
<path d="M220 315 V390" class="line"/>
<path d="M600 315 V390" class="line"/>
<path d="M980 315 V390" class="line"/>
<rect x="255" y="410" width="690" height="155" rx="22" class="box"/>
<circle cx="315" cy="458" r="15" class="bad"/>
<text x="350" y="466" class="text h">Fresh ChatGPT web session</text>
<text x="310" y="512" class="muted s">When to read which tool · what counts as current truth · what to persist</text>
<text x="310" y="542" class="muted s">Without a lifecycle, installed memory tools do not create continuity.</text>
<text x="600" y="630" text-anchor="middle" class="muted s">The missing piece was capture → authority → restore, not another memory package.</text>
</svg>