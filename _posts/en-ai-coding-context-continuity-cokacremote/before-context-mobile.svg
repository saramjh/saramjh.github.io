<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200"><style>
.bg{fill:#111418}.box{fill:#181d23;stroke:#303842;stroke-width:2}.t{fill:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.m{fill:#a7b0ba;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.bad{fill:#b95858}.h{font-size:30px;font-weight:760}.b{font-size:25px;font-weight:700}.s{font-size:21px}</style>
<rect class="bg" width="720" height="1200" rx="24"/><text x="45" y="65" class="t h">The tools were installed</text><text x="45" y="105" class="m s">But the session lifecycle was missing</text>
<rect x="45" y="150" width="630" height="200" rx="20" class="box"/><text x="85" y="205" class="t b">Serena</text><text x="85" y="252" class="m s">Project / memory retrieval</text><text x="85" y="292" class="m s">Automatic session bootstrap is separate</text>
<rect x="45" y="390" width="630" height="200" rx="20" class="box"/><text x="85" y="445" class="t b">claude-mem</text><text x="85" y="492" class="m s">Installed</text><text x="85" y="535" class="t b">현재 corpus: 0 records</text>
<rect x="45" y="630" width="630" height="200" rx="20" class="box"/><text x="85" y="685" class="t b">Ponytail</text><text x="85" y="732" class="m s">YAGNI · reuse · minimum diff</text><text x="85" y="772" class="m s">Policy, not project memory</text>
<rect x="45" y="885" width="630" height="195" rx="20" class="box"/><circle cx="90" cy="938" r="13" class="bad"/><text x="120" y="948" class="t b">새 ChatGPT Web 세션</text><text x="85" y="1000" class="m s">Without capture · authority · restore rules</text><text x="85" y="1040" class="m s">installed tools do not create continuity.</text>
<text x="360" y="1148" text-anchor="middle" class="m s">The missing piece was the lifecycle.</text></svg>