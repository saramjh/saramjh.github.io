<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Recipe와 Recipeed의 작성자 행</title>
  <desc id="desc">초기 Recipe 화면은 작성자 묶음을 가운데 배치했고, 초기 Recipeed 화면은 작성자 행에 유형 라벨을 추가했다. 현재 두 상세 화면은 프로필과 작성자 이름을 왼쪽에 같은 방식으로 배치하며 Recipeed 유형명은 브라우저 문서 제목에 남긴다.</desc>
  <rect width="1200" height="720" fill="#f4f2ec"/>
  <text x="72" y="76" fill="#172b3a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="700">Recipe와 Recipeed의 작성자 행</text>
  <text x="72" y="112" fill="#52616b" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18">두 상세 페이지의 작성자 정보 배치 비교</text>
  <rect x="72" y="150" width="510" height="470" rx="16" fill="#ebe9e1" stroke="#d2d0c8"/>
  <rect x="618" y="150" width="510" height="470" rx="16" fill="#e5eee9" stroke="#c6d7cf"/>
  <text x="104" y="196" fill="#263d4a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700">이전</text>
  <text x="650" y="196" fill="#263d4a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700">현재</text>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <rect x="96" y="220" width="462" height="164" rx="10" fill="#ffffff" stroke="#d5d4cd"/>
    <text x="120" y="252" fill="#596a73" font-size="15">Recipe 상세</text>
    <rect x="217" y="286" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="231" cy="296" r="5" fill="#526b62"/><path d="M221 309 Q231 296 241 309" fill="#526b62"/>
    <text x="258" y="306" fill="#172b3a" font-size="17" font-weight="600">작성자 이름</text>
    <text x="120" y="354" fill="#7b8588" font-size="13">프로필과 이름 묶음을 가운데 배치</text>
    <rect x="96" y="404" width="462" height="164" rx="10" fill="#ffffff" stroke="#d5d4cd"/>
    <text x="120" y="436" fill="#596a73" font-size="15">Recipeed 상세</text>
    <rect x="120" y="466" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="134" cy="476" r="5" fill="#526b62"/><path d="M124 489 Q134 476 144 489" fill="#526b62"/>
    <text x="160" y="486" fill="#172b3a" font-size="17" font-weight="600">작성자 이름</text>
    <rect x="284" y="461" width="90" height="34" rx="6" fill="#f1e8d9" stroke="#d7c8ae"/>
    <text x="329" y="483" fill="#765a34" font-size="14" text-anchor="middle">레시피드</text>
    <text x="120" y="538" fill="#7b8588" font-size="13">작성자 행에 유형 라벨 표시</text>
    <rect x="642" y="220" width="462" height="164" rx="10" fill="#ffffff" stroke="#cbd8d1"/>
    <text x="666" y="252" fill="#596a73" font-size="15">Recipe 상세</text>
    <rect x="666" y="286" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="680" cy="296" r="5" fill="#526b62"/><path d="M670 309 Q680 296 690 309" fill="#526b62"/>
    <text x="706" y="306" fill="#172b3a" font-size="17" font-weight="600">작성자 이름</text>
    <text x="666" y="354" fill="#526b62" font-size="13">프로필과 이름을 왼쪽 정렬</text>
    <rect x="642" y="404" width="462" height="164" rx="10" fill="#ffffff" stroke="#cbd8d1"/>
    <text x="666" y="436" fill="#596a73" font-size="15">Recipeed 상세</text>
    <rect x="666" y="466" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="680" cy="476" r="5" fill="#526b62"/><path d="M670 489 Q680 476 690 489" fill="#526b62"/>
    <text x="706" y="486" fill="#172b3a" font-size="17" font-weight="600">작성자 이름</text>
    <text x="666" y="538" fill="#526b62" font-size="13">유형명은 문서 제목에 유지</text>
  </g>
  <path d="M72 644 H1128" stroke="#c8c7bf" stroke-width="1"/>
  <text x="72" y="678" fill="#263d4a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="600">작성자 행: 프로필과 이름만 표시  |  Recipeed 유형명: 문서 제목에 유지</text>
</svg>
