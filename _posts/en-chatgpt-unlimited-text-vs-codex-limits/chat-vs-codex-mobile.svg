<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050"><style>
.bg{fill:#111418}.box{fill:#181d23;stroke:#303842;stroke-width:2}.t{fill:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.m{fill:#a7b0ba;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.ok{fill:#1f9d7a}.warn{fill:#c28a34}.h{font-size:32px;font-weight:760}.b{font-size:26px;font-weight:700}.s{font-size:22px}</style>
<rect class="bg" width="720" height="1050" rx="24"/><text x="45" y="65" class="t h">Same account, different allowance models</text><text x="45" y="103" class="m s">OpenAI pricing · October 2026</text>
<rect x="45" y="145" width="630" height="360" rx="22" class="box"/><circle cx="90" cy="200" r="13" class="ok"/><text x="120" y="210" class="t h">ChatGPT Web</text><text x="85" y="260" class="t b">Everyday text chats</text><text x="85" y="330" class="t" style="font-size:54px;font-weight:850">Unlimited*</text><text x="85" y="380" class="m s">Free · Go · Plus · Pro</text><text x="85" y="430" class="m s">* Subject to abuse-prevention guardrails</text><text x="85" y="468" class="m s">Files, images and tools can have separate limits</text>
<rect x="45" y="545" width="630" height="360" rx="22" class="box"/><circle cx="90" cy="600" r="13" class="warn"/><text x="120" y="610" class="t h">Codex</text><text x="85" y="660" class="t b">Coding-agent usage</text><text x="85" y="730" class="t" style="font-size:50px;font-weight:850">Separate limits</text><text x="85" y="782" class="m s">Varies by plan, model and task complexity</text><text x="85" y="832" class="m s">reset / usage dashboard / credits</text>
<text x="360" y="974" text-anchor="middle" class="m s">Unlimited chat ≠ unlimited everything</text></svg>