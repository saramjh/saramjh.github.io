<text x="36" y="118" font-family="Arial, sans-serif" font-size="17" fill="#657F77">First-party implementation · 2026-11-11</text>
<rect x="36" y="176" width="280" height="214" rx="16" fill="#FFFFFF" stroke="#D4DDD9" stroke-width="2"/><circle cx="70" cy="211" r="19" fill="#1F554E"/><text x="70" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text><text x="55" y="269" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="700" fill="#213C38">공개 레시피·레시피드</text><text x="55" y="314" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="15" fill="#59716B">투표가 있는 글에서만 질문 표시</text><path d="M 318 281 H 343 M 336 275 L 343 281 L 336 287" fill="none" stroke="#56766F" stroke-width="2"/><rect x="346" y="176" width="280" height="214" rx="16" fill="#FFFFFF" stroke="#D4DDD9" stroke-width="2"/><circle cx="380" cy="211" r="19" fill="#1F554E"/><text x="380" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text><text x="365" y="269" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="700" fill="#213C38">질문과 선택지</text><text x="365" y="314" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="15" fill="#59716B">2~4개 선택지, 본문과 분리</text><path d="M 628 281 H 653 M 646 275 L 653 281 L 646 287" fill="none" stroke="#56766F" stroke-width="2"/><rect x="656" y="176" width="280" height="214" rx="16" fill="#FFFFFF" stroke="#D4DDD9" stroke-width="2"/><circle cx="690" cy="211" r="19" fill="#1F554E"/><text x="690" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text><text x="675" y="269" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="700" fill="#213C38">로그인 후 투표</text><text x="675" y="314" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="15" fill="#59716B">회원당 현재 한 표, 선택 변경 가능</text><path d="M 938 281 H 963 M 956 275 L 963 281 L 956 287"