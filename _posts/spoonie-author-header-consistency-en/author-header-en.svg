<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One author row across two detail pages</title>
  <desc id="desc">The initial Recipe layout centered the author group, and the initial Recipeed layout added a type label to the author row. Both current detail pages place the profile and author name on the left, with the Recipeed type in the browser document title.</desc>
  <rect width="1200" height="720" fill="#f4f2ec"/>
  <text x="72" y="76" fill="#172b3a" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">One author row across two detail pages</text>
  <text x="72" y="112" fill="#52616b" font-family="Inter, Arial, sans-serif" font-size="18">Comparing author information on Recipe and Recipeed</text>
  <rect x="72" y="150" width="510" height="470" rx="16" fill="#ebe9e1" stroke="#d2d0c8"/>
  <rect x="618" y="150" width="510" height="470" rx="16" fill="#e5eee9" stroke="#c6d7cf"/>
  <text x="104" y="196" fill="#263d4a" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Before</text>
  <text x="650" y="196" fill="#263d4a" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Current</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="96" y="220" width="462" height="164" rx="10" fill="#ffffff" stroke="#d5d4cd"/>
    <text x="120" y="252" fill="#596a73" font-size="15">Recipe detail</text>
    <rect x="217" y="286" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="231" cy="296" r="5" fill="#526b62"/><path d="M221 309 Q231 296 241 309" fill="#526b62"/>
    <text x="258" y="306" fill="#172b3a" font-size="17" font-weight="600">Author name</text>
    <text x="120" y="354" fill="#7b8588" font-size="13">Profile and name group centered</text>
    <rect x="96" y="404" width="462" height="164" rx="10" fill="#ffffff" stroke="#d5d4cd"/>
    <text x="120" y="436" fill="#596a73" font-size="15">Recipeed detail</text>
    <rect x="120" y="466" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="134" cy="476" r="5" fill="#526b62"/><path d="M124 489 Q134 476 144 489" fill="#526b62"/>
    <text x="160" y="486" fill="#172b3a" font-size="17" font-weight="600">Author name</text>
    <rect x="284" y="461" width="90" height="34" rx="6" fill="#f1e8d9" stroke="#d7c8ae"/>
    <text x="329" y="483" fill="#765a34" font-size="14" text-anchor="middle">Recipeed</text>
    <text x="120" y="538" fill="#7b8588" font-size="13">Type label shown in author row</text>
    <rect x="642" y="220" width="462" height="164" rx="10" fill="#ffffff" stroke="#cbd8d1"/>
    <text x="666" y="252" fill="#596a73" font-size="15">Recipe detail</text>
    <rect x="666" y="286" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="680" cy="296" r="5" fill="#526b62"/><path d="M670 309 Q680 296 690 309" fill="#526b62"/>
    <text x="706" y="306" fill="#172b3a" font-size="17" font-weight="600">Author name</text>
    <text x="666" y="354" fill="#526b62" font-size="13">Profile and name, left-aligned</text>
    <rect x="642" y="404" width="462" height="164" rx="10" fill="#ffffff" stroke="#cbd8d1"/>
    <text x="666" y="436" fill="#596a73" font-size="15">Recipeed detail</text>
    <rect x="666" y="466" width="28" height="28" rx="14" fill="#b8c9c2"/>
    <circle cx="680" cy="476" r="5" fill="#526b62"/><path d="M670 489 Q680 476 690 489" fill="#526b62"/>
    <text x="706" y="486" fill="#172b3a" font-size="17" font-weight="600">Author name</text>
    <text x="666" y="538" fill="#526b62" font-size="13">Type remains in the document title</text>
  </g>
  <path d="M72 644 H1128" stroke="#c8c7bf" stroke-width="1"/>
  <text x="72" y="678" fill="#263d4a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Author row: profile and name only  |  Recipeed type: document title</text>
</svg>
