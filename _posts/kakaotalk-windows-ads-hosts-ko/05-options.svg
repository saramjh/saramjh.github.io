 <text x="64" y="156" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="42" fill="#fff">05  화면과 방식의 차이</text><rect x="64" y="216" width="516" height="281" rx="13" fill="#1a2d40"/><rect x="622" y="216" width="514" height="281" rx="13" fill="#1a2d40"/><text x="89" y="285" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="24" fill="#6be5d6">A</text><text x="89" y="351" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="650" font-size="27" fill="#fff">메인 창 하단 배너</text><text x="89" y="416" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="500" font-size="23" fill="#b6cbd5">광고 대신 공지로 대체될 수 있음</text><text x="647" y="285" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="24" fill="#6be5d6">B</text><text x="647" y="351" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="650" font-size="27" fill="#fff">시작 시 팝업</text><text x="647" y="416" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="500" font-size="23" fill="#b6cbd5">별도 통신 경로일 수 있음</text><rect x="64" y="526" width="1072" height="62" rx="13" fill="#3b302b"/><text x="85" y="569" font-family="Apple SD Gothic Neo,Helvetica Neue,Arial,sans-serif" font-weight="600" font-size="21" fill="#f7d4af">차단 주소를 무분별하게 늘리지 말고 기능 이상 시 복구</text>
