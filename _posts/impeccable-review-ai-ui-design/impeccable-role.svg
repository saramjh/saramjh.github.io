<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="t d">
<title id="t">Impeccable을 실제로 사용한 역할</title><desc id="d">제품 계약을 기준으로 critique와 design vocabulary, deterministic detector를 사용하고 마지막에 브라우저 QA를 수행하는 구조.</desc>
<style>
.bg{fill:#111418}.box{fill:#181d23;stroke:#333c47;stroke-width:2}.text{fill:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.muted{fill:#a9b2bc;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.accent{fill:#2b86bd}.good{fill:#1f9d7a}.line{stroke:#657382;stroke-width:3;fill:none}.h{font-size:31px;font-weight:760}.b{font-size:24px;font-weight:700}.s{font-size:20px}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10z" fill="#657382"/></marker></defs>
<rect class="bg" width="720" height="1040" rx="24"/>
<text x="45" y="66" class="text h">Impeccable ≠ 자동 디자이너</text>
<text x="45" y="105" class="muted s">제가 가장 유용하게 쓴 역할은 design discipline + QA였습니다.</text>
<rect x="80" y="155" width="560" height="115" rx="18" class="box"/>
<text x="360" y="203" text-anchor="middle" class="text b">PRODUCT / DESIGN / 플랫폼 규칙</text>
<text x="360" y="238" text-anchor="middle" class="muted s">프로젝트 계약이 최상위 기준</text>
<path d="M360 270 V325" class="line" marker-end="url(#a)"/>
<rect x="80" y="345" width="560" height="145" rx="18" class="box"/>
<circle cx="125" cy="390" r="11" class="accent"/>
<text x="360" y="395" text-anchor="middle" class="text b">critique / audit / harden / adapt</text>
<text x="360" y="432" text-anchor="middle" class="muted s">모호한 “예쁘게” 대신 작업 범위를 좁힘</text>
<text x="360" y="462" text-anchor="middle" class="muted s">제품 흐름·접근성·반응형·정보 위계 검토</text>
<path d="M360 490 V545" class="line" marker-end="url(#a)"/>
<rect x="80" y="565" width="560" height="145" rx="18" class="box"/>
<circle cx="125" cy="610" r="11" class="good"/>
<text x="360" y="615" text-anchor="middle" class="text b">deterministic detector</text>
<text x="360" y="652" text-anchor="middle" class="muted s">반복 UI anti-pattern을 코드에서 검사</text>
<text x="360" y="682" text-anchor="middle" class="muted s">CI gate에 넣어 재발 방지</text>
<path d="M360 710 V765" class="line" marker-end="url(#a)"/>
<rect x="80" y="785" width="560" height="130" rx="18" class="box"/>
<text x="360" y="832" text-anchor="middle" class="text b">desktop + mobile browser QA</text>
<text x="360" y="870" text-anchor="middle" class="muted s">실제 화면·키보드·상태를 다시 확인</text>
<text x="360" y="982" text-anchor="middle" class="muted s">Clean detector는 증거 하나일 뿐, release approval은 아님.</text>
</svg>