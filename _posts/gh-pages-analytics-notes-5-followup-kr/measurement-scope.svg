<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">같은 호스트 아래, 서로 다른 서비스</title><desc id="desc">Shared GitHub Pages hostname has blog and tool paths. KoreAves has its own hostname.</desc><defs><pattern id="partial" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#edf2ef"/><path d="M-2 2L2-2M0 10L10 0M8 12L12 8" stroke="#7d938d" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="#fbfcfa"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, system-ui, sans-serif"><text x="54" y="64" font-size="21" fill="#536c69" font-weight="600" text-anchor="start">MEASUREMENT SCOPE</text><text x="54" y="119" font-size="40" fill="#1c302f" font-weight="700" text-anchor="start">같은 호스트 아래, 서로 다른 서비스</text><text x="54" y="175" font-size="26" fill="#536c69" font-weight="400" text-anchor="start">호스트 이름만으로는 블로그와 도구를 나눌 수 없습니다.</text><text x="54" y="312" font-size="34" fill="#1c302f" font-weight="700" text-anchor="start">saramjh.github.io</text><text x="54" y="354" font-size="24" fill="#536c69" font-weight="400" text-anchor="start">공유 호스트 · 통합 GA4</text><line x1="352" y1="305" x2="403" y2="305" stroke="#28736a" stroke-width="3"/><line x1="403" y1="238" x2="403" y2="476" stroke="#28736a" stroke-width="3"/><line x1="403" y1="238" x2="433" y2="238" stroke="#28736a" stroke-width="3"/><text x="449" y="247" font-size="26" fill="#1c302f" font-weight="600" text-anchor="start">/</text><text x="925" y="247" font-size="24" fill="#536c69" font-weight="400" text-anchor="end">블로그 홈</text><line x1="403" y1="297" x2="433" y2="297" stroke="#28736a" stroke-width="3"/><text x="449" y="306" font-size="26" fill="#1c302f" font-weight="600" text-anchor="start">/gh-pages-analytics-notes-…/</text><text x="925" y="306" font-size="24" fill="#536c69" font-weight="400" text-anchor="end">블로그 글</text><line x1="403" y1="356" x2="433" y2="356" stroke="#28736a" stroke-width="3"/><text x="449" y="365" font-size="26" fill="#1c302f" font-weight="600" text-anchor="start">/richChecker/</text><text x="925" y="365" font-size="24" fill="#536c69" font-weight="400" text-anchor="end">관상체크</text><line x1="403" y1="415" x2="433" y2="415" stroke="#28736a" stroke-width="3"/><text x="449" y="424" font-size="26" fill="#1c302f" font-weight="600" text-anchor="start">/scratchLottery/</text><text x="925" y="424" font-size="24" fill="#536c69" font-weight="400" text-anchor="end">복권 시뮬레이터</text><line x1="403" y1="474" x2="433" y2="474" stroke="#28736a" stroke-width="3"/><text x="449" y="483" font-size="26" fill="#1c302f" font-weight="600" text-anchor="start">/space_atlas_student/</text><text x="925" y="483" font-size="24" fill="#536c69" font-weight="400" text-anchor="end">Space Atlas</text><line x1="54" y1="521" x2="944" y2="521" stroke="#dce5e1" stroke-width="2"/><text x="54" y="578" font-size="32" fill="#1c302f" font-weight="700" text-anchor="start">koreaves.com</text><text x="374" y="578" font-size="27" fill="#28736a" font-weight="600" text-anchor="start">별도 호스트 · Cloudflare Web Analytics</text><text x="54" y="635" font-size="25" fill="#536c69" font-weight="400" text-anchor="start">비교할 때는 호스트 + 정확한 페이지 경로 + 기간을 함께 맞춥니다.</text></g></svg>