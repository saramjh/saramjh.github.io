<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Local project workflow from ChatGPT</title>
<desc id="desc">A sequence showing ChatGPT bootstrapping a project, checking Git and documentation, editing files, running tests, and optionally pushing deployment changes.</desc>
<defs><style>
.bg{fill:#111418}.node{fill:#1a1f26;stroke:#303842;stroke-width:2}.num{fill:#277fb9}.text{fill:#f2f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.muted{fill:#a8b1ba;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.line{stroke:#667482;stroke-width:3;fill:none}.label{font-size:19px;font-weight:700}.small{font-size:15px}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10z" fill="#667482"/></marker></defs>
<rect class="bg" width="1200" height="690" rx="24"/>
<text x="64" y="70" class="text" style="font-size:28px;font-weight:700">A normal project session after the connection is already set up</text>
<text x="64" y="101" class="muted" style="font-size:16px">The useful part is not remote shell access by itself. It is the whole development loop in one conversation.</text>
<g transform="translate(80,155)"><rect width="190" height="120" rx="16" class="node"/><circle cx="34" cy="32" r="18" class="num"/><text x="34" y="39" text-anchor="middle" class="text small">1</text><text x="24" y="76" class="text label">Bootstrap</text><text x="24" y="101" class="muted small">project context</text></g>
<path d="M270 215 H315" class="line" marker-end="url(#a)"/>
<g transform="translate(330,155)"><rect width="190" height="120" rx="16" class="node"/><circle cx="34" cy="32" r="18" class="num"/><text x="34" y="39" text-anchor="middle" class="text small">2</text><text x="24" y="76" class="text label">Inspect</text><text x="24" y="101" class="muted small">Git + docs + code</text></g>
<path d="M520 215 H565" class="line" marker-end="url(#a)"/>
<g transform="translate(580,155)"><rect width="190" height="120" rx="16" class="node"/><circle cx="34" cy="32" r="18" class="num"/><text x="34" y="39" text-anchor="middle" class="text small">3</text><text x="24" y="76" class="text label">Change</text><text x="24" y="101" class="muted small">minimum real diff</text></g>
<path d="M770 215 H815" class="line" marker-end="url(#a)"/>
<g transform="translate(830,155)"><rect width="260" height="120" rx="16" class="node"/><circle cx="34" cy="32" r="18" class="num"/><text x="34" y="39" text-anchor="middle" class="text small">4</text><text x="24" y="76" class="text label">Verify</text><text x="24" y="101" class="muted small">build · tests · browser</text></g>
<path d="M960 275 V345 H600" class="line" marker-end="url(#a)"/>
<g transform="translate(360,380)"><rect width="480" height="120" rx="16" class="node"/><circle cx="40" cy="34" r="18" class="num"/><text x="40" y="41" text-anchor="middle" class="text small">5</text><text x="76" y="43" class="text label">Checkpoint what changed and why</text><text x="30" y="82" class="muted small">A new chat can recover the current goal, decisions and blockers</text><text x="30" y="106" class="muted small">without treating old memory as more authoritative than the repository.</text></g>
<path d="M600 500 V550" class="line" marker-end="url(#a)"/>
<rect x="425" y="570" width="350" height="65" rx="14" fill="#222832"/><text x="600" y="610" text-anchor="middle" class="text label">commit / push / deploy when needed</text>
</svg>
