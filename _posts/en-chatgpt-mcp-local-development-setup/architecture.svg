<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT MCP local development architecture</title>
<desc id="desc">ChatGPT connects through HTTPS and OAuth to a Cloudflare Quick Tunnel, then cokacremote on the local Mac exposes filesystem, shell, Git, browser, and project context tools.</desc>
<defs>
  <style>
    .bg{fill:#111418}.panel{fill:#171b21;stroke:#303741;stroke-width:2}.accent{fill:#1f9d7a}.accent2{fill:#2786c6}
    .text{fill:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.muted{fill:#aab3bd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .label{font-size:20px;font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.line{stroke:#6c7885;stroke-width:3;fill:none}.dash{stroke-dasharray:8 8}
  </style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#6c7885"/></marker>
</defs>
<rect class="bg" width="1200" height="700" rx="24"/>
<text x="70" y="72" class="text label">The setup I actually use</text>
<text x="70" y="102" class="muted small">chatgpt.com in a browser as the control surface, my Mac as the execution environment</text>
<rect x="70" y="165" width="250" height="140" rx="18" class="panel"/>
<text x="195" y="220" text-anchor="middle" class="text label">ChatGPT Web</text>
<text x="195" y="252" text-anchor="middle" class="muted small">chatgpt.com in browser</text>
<text x="195" y="278" text-anchor="middle" class="muted tiny">conversation + tool calls</text>
<rect x="475" y="165" width="250" height="140" rx="18" class="panel"/>
<text x="600" y="214" text-anchor="middle" class="text label">Cloudflare</text>
<text x="600" y="242" text-anchor="middle" class="text label">Quick Tunnel</text>
<text x="600" y="274" text-anchor="middle" class="muted tiny">temporary HTTPS endpoint</text>
<rect x="880" y="165" width="250" height="140" rx="18" class="panel"/>
<text x="1005" y="220" text-anchor="middle" class="text label">cokacremote</text>
<text x="1005" y="252" text-anchor="middle" class="muted small">127.0.0.1:3000</text>
<text x="1005" y="278" text-anchor="middle" class="muted tiny">OAuth-protected /mcp</text>
<path d="M320 235 H465" class="line" marker-end="url(#arrow)"/>
<text x="393" y="218" text-anchor="middle" class="muted tiny">HTTPS + OAuth</text>
<path d="M725 235 H870" class="line" marker-end="url(#arrow)"/>
<text x="798" y="218" text-anchor="middle" class="muted tiny">tunnel → localhost</text>
<rect x="95" y="430" width="1010" height="175" rx="20" class="panel"/>
<text x="130" y="475" class="text label">Local Mac</text>
<rect x="130" y="510" width="160" height="60" rx="12" fill="#222832"/>
<rect x="315" y="510" width="160" height="60" rx="12" fill="#222832"/>
<rect x="500" y="510" width="160" height="60" rx="12" fill="#222832"/>
<rect x="685" y="510" width="160" height="60" rx="12" fill="#222832"/>
<rect x="870" y="510" width="195" height="60" rx="12" fill="#222832"/>
<text x="210" y="547" text-anchor="middle" class="text small">Filesystem</text>
<text x="395" y="547" text-anchor="middle" class="text small">Shell</text>
<text x="580" y="547" text-anchor="middle" class="text small">Git / tests</text>
<text x="765" y="547" text-anchor="middle" class="text small">Browser</text>
<text x="968" y="547" text-anchor="middle" class="text small">Project context</text>
<path d="M1005 305 V400 H600 V420" class="line dash" marker-end="url(#arrow)"/>
<circle cx="1005" cy="235" r="8" class="accent"/>
<circle cx="600" cy="235" r="8" class="accent2"/>
<text x="600" y="654" text-anchor="middle" class="muted tiny">The MCP server runs commands with the host user's real permissions. Authentication is not optional here.</text>
</svg>
