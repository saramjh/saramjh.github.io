<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Redacted setup terminal transcript</title>
<desc id="desc">A sanitized terminal-style rendering of the setup script starting a Quick Tunnel, validating health and OAuth discovery, and verifying that unauthenticated MCP access returns 401.</desc>
<defs><style>
.bg{fill:#0f1216}.bar{fill:#1d2229}.text{fill:#e8edf2;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:21px}.muted{fill:#8995a3}.ok{fill:#65c18c}.warn{fill:#e2b86b}.blue{fill:#67aee8}
</style></defs>
<rect class="bg" width="1200" height="720" rx="22"/>
<rect class="bar" x="0" y="0" width="1200" height="58" rx="22"/><rect class="bar" x="0" y="36" width="1200" height="22"/>
<circle cx="34" cy="29" r="7" fill="#ff6b63"/><circle cx="58" cy="29" r="7" fill="#e6bf55"/><circle cx="82" cy="29" r="7" fill="#61c454"/>
<text x="600" y="36" text-anchor="middle" class="muted" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px">sanitized example — no real endpoint or secret shown</text>
<text x="48" y="112" class="text"><tspan fill="#67aee8">$</tspan> ./setup-oauth-quicktunnel.sh</text>
<text x="48" y="162" class="text"><tspan class="muted">[23:11:02]</tspan> locating existing cokacremote checkout</text>
<text x="48" y="208" class="text"><tspan class="muted">[23:11:02]</tspan> local health check <tspan class="ok">OK</tspan></text>
<text x="48" y="254" class="text"><tspan class="muted">[23:11:03]</tspan> starting Cloudflare Quick Tunnel</text>
<text x="48" y="300" class="text"><tspan class="muted">[23:11:06]</tspan> public endpoint https://&lt;random&gt;.trycloudflare.com</text>
<text x="48" y="346" class="text"><tspan class="muted">[23:11:07]</tspan> OAuth metadata discovery <tspan class="ok">OK</tspan></text>
<text x="48" y="392" class="text"><tspan class="muted">[23:11:07]</tspan> /health local <tspan class="ok">200</tspan> · public <tspan class="ok">200</tspan></text>
<text x="48" y="438" class="text"><tspan class="muted">[23:11:08]</tspan> /mcp without auth <tspan class="ok">401</tspan></text>
<rect x="44" y="490" width="1112" height="154" rx="12" fill="#151a20" stroke="#2d353f" stroke-width="2"/>
<text x="72" y="533" class="text" style="font-size:19px">ChatGPT MCP URL</text>
<text x="360" y="533" class="text blue" style="font-size:19px">https://&lt;random&gt;.trycloudflare.com/mcp</text>
<text x="72" y="577" class="text" style="font-size:19px">Authentication</text>
<text x="360" y="577" class="text ok" style="font-size:19px">OAuth 2.1</text>
<text x="72" y="621" class="text" style="font-size:19px">approval key</text>
<text x="360" y="621" class="text warn" style="font-size:19px">&lt;redacted — stored separately&gt;</text>
<text x="48" y="684" class="muted" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px">Reconstructed from the verified setup flow; this is not a screenshot containing my live tunnel URL.</text>
</svg>
