# Site settings
title: DevTestudinidae # site title
description: >- # site description
  Practical notes on AI-assisted development, automation, web tools, and troubleshooting, based on reproducible experiments and real projects.
lang: en-US # default lang
timezone: Asia/Seoul # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/saramjh?tab=repositories # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: DevTestudinidae # author name
  bio: >- # tell to the world
    Independent developer writing practical notes on AI-assisted development, automation, troubleshooting, and small web tools.
  username: devtestudinidae # general username
  github: saramjh # github username
  twitter: devtestudinidae # twitter username
  facebook: devtestudinidae # facebook username
  email: devtestudinidae@gmail.com # public contact email
  avatar: /assets/img/avatar.jpg # change with your own avatar
  url: /about/
  same_as:
    - https://github.com/saramjh

# URL settings
url: "https://saramjh.github.io" #
baseurl:
permalink: /:title/
google_analytics: G-4DYFKSNFBG # leave it blank if not wish
google_adsense: ca-pub-4410729598083068 # leave it blank if not wish
naver_site_verification: 7c9f31d4d0aad1444db757e80b29f882 # Naver Search Advisor
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

comments:
  provider: disqus
  disqus:
    shortname: devtestudinidae-github-io

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
      comments: true

# Homepage limit posts
number_of_posts: 100

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - .context
  - .serena
  - AGENTS.md
  - CLAUDE.md
  - scripts
  - tests
  - vendor
  - docs
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
