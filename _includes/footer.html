<script src="/assets/js/main.js" defer="defer"></script>
{%- if site.google_analytics -%}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("js", new Date());

  gtag("config", "{{ site.google_analytics }}");
</script>
{%- endif -%}
{%- if page.url == '/archive/' -%}
<script src="/assets/js/search.min.js"></script>
<script>
  var sjs = SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('search-results'),
    json: '/assets/search.json',
  });
</script>
{%- endif -%}

<script type="module">
  document.addEventListener("DOMContentLoaded", async () => {
    const mermaidNodes = document.querySelectorAll("code.language-mermaid, .language-mermaid pre code");
    if (mermaidNodes.length === 0) return;

    try {
      const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs");
      const isDark = document.body.getAttribute("data-theme") === "dark";
      
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? "dark" : "default",
        securityLevel: "loose",
        fontFamily: "inherit"
      });

      const elementsToRender = [];
      mermaidNodes.forEach((codeEl) => {
        const parent = codeEl.closest(".language-mermaid") || codeEl.closest("pre");
        const container = document.createElement("div");
        container.className = "mermaid";
        container.textContent = codeEl.textContent;
        parent.parentNode.replaceChild(container, parent);
        elementsToRender.push(container);
      });

      if (elementsToRender.length > 0) {
        await mermaid.run({ nodes: elementsToRender });
      }
    } catch (err) {
      console.error("Failed to load or render Mermaid diagrams:", err);
    }
  });
</script>
<style>
  .mermaid {
    text-align: center;
    margin: 1.8rem auto;
    overflow-x: auto;
    padding: 1rem 0;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
    display: inline-block;
  }
</style>
