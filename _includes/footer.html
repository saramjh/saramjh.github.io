{%- if site.google_analytics and page.tracking != false -%}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("js", new Date());
  gtag("config", "{{ site.google_analytics }}");

  (function (w, d, id) {
    function loadAnalytics() {
      if (d.querySelector('script[data-blog-ga]')) return;
      var s = d.createElement("script");
      s.async = true;
      s.dataset.blogGa = "true";
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
      d.head.appendChild(s);
    }
    if ("requestIdleCallback" in w) {
      w.requestIdleCallback(loadAnalytics, { timeout: 2500 });
    } else {
      w.addEventListener("load", function () {
        setTimeout(loadAnalytics, 0);
      }, { once: true });
    }
  })(window, document, "{{ site.google_analytics }}");
</script>
{%- endif -%}

{%- if page.tracking != false -%}
<script>
  (function (w, d, name, id) {
    w[name] = w[name] || function () {
      (w[name].q = w[name].q || []).push(arguments);
    };
    function loadClarity() {
      if (d.querySelector('script[data-blog-clarity]')) return;
      var s = d.createElement("script");
      s.async = true;
      s.dataset.blogClarity = "true";
      s.src = "https://www.clarity.ms/tag/" + id;
      d.head.appendChild(s);
    }
    if ("requestIdleCallback" in w) {
      w.requestIdleCallback(loadClarity, { timeout: 3000 });
    } else {
      w.addEventListener("load", function () {
        setTimeout(loadClarity, 500);
      }, { once: true });
    }
  })(window, document, "clarity", "yiij6vbnl0");
</script>

<script type="module">
  document.addEventListener("DOMContentLoaded", async () => {
    const mermaidNodes = document.querySelectorAll("code.language-mermaid, .language-mermaid pre code");
    if (mermaidNodes.length === 0) return;

    try {
      const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs");
      const isDark = document.body.getAttribute("data-theme") === "dark";
      
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? "dark" : "default",
        securityLevel: "loose",
        fontFamily: "inherit"
      });

      const elementsToRender = [];
      mermaidNodes.forEach((codeEl) => {
        const parent = codeEl.closest(".language-mermaid") || codeEl.closest("pre");
        const container = document.createElement("div");
        container.className = "mermaid";
        container.textContent = codeEl.textContent;
        parent.parentNode.replaceChild(container, parent);
        elementsToRender.push(container);
      });

      if (elementsToRender.length > 0) {
        await mermaid.run({ nodes: elementsToRender });
      }
    } catch (err) {
      console.error("Failed to load or render Mermaid diagrams:", err);
    }
  });
</script>
<style>
  .mermaid {
    text-align: center;
    margin: 1.8rem auto;
    overflow-x: auto;
    padding: 1rem 0;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
    display: inline-block;
  }
  body[data-theme="dark"] .mermaid .edgeLabel {
    color: #fff !important;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("div.highlighter-rouge").forEach((wrapper) => {
      if (wrapper.querySelector(".code-header") || wrapper.classList.contains("language-mermaid")) return;
      const pre = wrapper.querySelector("pre");
      if (!pre) return;

      let lang = "";
      wrapper.classList.forEach((cls) => {
        if (cls.startsWith("language-")) {
          lang = cls.replace("language-", "").toUpperCase();
        }
      });
      if (!lang || lang === "PLAINTEXT") lang = "CODE";

      const header = document.createElement("div");
      header.className = "code-header";
      header.innerHTML = `
        <span class="code-lang">${lang}</span>
        <button class="code-copy-btn" type="button" aria-label="Copy code">
          <svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span class="copy-text">Copy</span>
        </button>
      `;

      const copyBtn = header.querySelector(".code-copy-btn");
      copyBtn.addEventListener("click", async () => {
        const codeEl = pre.querySelector("code");
        const codeText = codeEl ? codeEl.innerText : pre.innerText;
        try {
          await navigator.clipboard.writeText(codeText);
          copyBtn.classList.add("copied");
          copyBtn.querySelector(".copy-text").innerText = "Copied!";
          setTimeout(() => {
            copyBtn.classList.remove("copied");
            copyBtn.querySelector(".copy-text").innerText = "Copy";
          }, 2000);
        } catch (e) {
          console.error("Copy failed", e);
        }
      });

      wrapper.prepend(header);
    });
  });
</script>
<style>
  /* 코드 영역 외곽 카드 컨테이너 */
  .highlighter-rouge {
    position: relative !important;
    margin: 1.8rem 0 !important;
    border-radius: 8px !important;
    overflow: hidden !important;
    border: 1px solid #d0d7de !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05) !important;
    background-color: #f6f8fa !important;
  }
  body[data-theme="dark"] .highlighter-rouge {
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45) !important;
    background-color: #1a1e27 !important;
  }

  /* pre 내부 여백 및 음수 마진 방지 */
  .highlighter-rouge pre.highlight,
  .highlighter-rouge pre,
  .highlight pre {
    margin: 0 !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 16px 20px !important;
    box-sizing: border-box !important;
    width: 100% !important;
    overflow-x: auto !important;
  }
  .highlighter-rouge pre > code {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    background: transparent !important;
    display: block !important;
  }

  /* 상단 헤더 바 */
  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    font-size: 0.72rem;
    font-weight: 600;

    border-bottom: 1px solid #d0d7de;

  }
  body[data-theme="dark"] .code-header {
    background-color: #242933;
    color: #9da7b3;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .code-copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 0.72rem;
    color: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .code-copy-btn:hover {
    background: rgba(128, 128, 128, 0.18);
    color: #24292f;
  }
  body[data-theme="dark"] .code-copy-btn:hover {
    color: #f0f6fc;
  }
  .code-copy-btn.copied {
    color: #2da44e !important;
    font-weight: 700;
  }
</style>
